<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MELORA — Jiang Yishan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800;900&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   JIANG YISHAN — CREATIVE INTELLIGENCE ARCHIVE
   设计系统 v2：更通透的暗色档案 + 丰富 hover 动效
   ============================================================ */

:root {
  --bg: #0e0e12;
  --bg-soft: #15151c;
  --bg-hover: #1c1c26;
  --ink: #f5f4f1;
  --ink-dim: #b0afba;
  --ink-faint: #6e6d7a;
  --line: rgba(245, 244, 241, 0.12);
  --line-soft: rgba(245, 244, 241, 0.06);
  --acc: #9d7af7;
  --acc-dim: rgba(157, 122, 247, 0.18);
  --acc-glow: rgba(157, 122, 247, 0.35);
  --c-aigc: #9d7af7;
  --c-brand: #e8d98a;
  --c-app: #f2b05e;
  --c-ip: #a2d4f5;
  --c-intern: #a8e0af;
  --font-disp: 'Archivo', 'Noto Sans SC', sans-serif;
  --font-body: 'Archivo', 'Noto Sans SC', sans-serif;
  --font-mono: 'JetBrains Mono', 'Noto Sans SC', monospace;
  --pad: clamp(48px, 7vw, 96px);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --dur: 0.6s;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* 极简全局背景 */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(ellipse 60% 50% at 80% 20%, rgba(157,122,247,0.04) 0%, transparent 60%);
}

img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
ul { list-style: none; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

::selection { background: var(--acc); color: #fff; }

.wrap {
  max-width: 1600px;
  margin: 0 auto;
  padding-left: var(--pad);
  padding-right: var(--pad);
}

.mono {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* ---------------- 顶导航 ---------------- */
.nav {
  position: fixed;
  inset: 0 0 auto 0;
  z-index: 100;
  border-bottom: 1px solid var(--line-soft);
  background: rgba(14, 14, 18, 0.82);
  backdrop-filter: blur(12px);
}
.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
}
.nav-logo {
  font-family: var(--font-disp);
  font-weight: 800;
  font-size: 15px;
  letter-spacing: 0.04em;
  transition: letter-spacing 0.4s var(--ease);
}
.nav-logo:hover { letter-spacing: 0.12em; }
.nav-logo sup { color: var(--acc); font-size: 9px; }
.nav-links { display: flex; align-items: center; gap: clamp(16px, 3vw, 40px); }
.nav-links a {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-dim);
  padding: 6px 2px;
  border-bottom: 1px solid transparent;
  transition: color 0.3s var(--ease), border-color 0.3s var(--ease), letter-spacing 0.3s var(--ease);
  position: relative;
}
.nav-links a::after {
  content: '';
  position: absolute; bottom: -1px; left: 0;
  width: 100%; height: 1px;
  background: var(--acc);
  transform: scaleX(0); transform-origin: right;
  transition: transform 0.4s var(--ease);
}
.nav-links a:hover::after { transform: scaleX(1); transform-origin: left; }
.nav-links a:hover, .nav-links a.active { color: var(--ink); }
.nav-links a:focus-visible, button:focus-visible, a:focus-visible {
  outline: 1px solid var(--acc);
  outline-offset: 3px;
}
.lang-btn {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.1em;
  color: var(--ink);
  border: 1px solid var(--line);
  padding: 6px 14px;
  transition: border-color 0.3s var(--ease), color 0.3s var(--ease), box-shadow 0.3s var(--ease);
}
.lang-btn:hover { border-color: var(--acc); color: var(--acc); box-shadow: 0 0 18px var(--acc-dim); }

/* ---------------- Hero ---------------- */
.hero {
  min-height: 100svh;
  display: grid;
  grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
  align-items: start;
  gap: clamp(24px, 4vw, 64px);
  padding-top: 120px;
  padding-bottom: 60px;
  position: relative;
}
.hero-tags { display: flex; flex-direction: column; gap: 4px; margin-bottom: clamp(20px, 3vh, 40px); }
.hero-tags span {
  font-family: var(--font-mono);
  font-size: clamp(11px, 1vw, 13px);
  letter-spacing: 0.22em;
  color: var(--ink-dim);
}
.hero-tags span:first-child { color: var(--acc); }
.hero-name {
  font-family: var(--font-disp);
  font-weight: 900;
  font-size: clamp(100px, 20vw, 380px);
  line-height: 0.78;
  letter-spacing: -0.02em;
  text-transform: uppercase;
}
.hero-name .hero-row1,
.hero-name .row2 {
  display: block;
}
.hero-name .row2 { margin-left: clamp(8px, 1.5vw, 32px); color: transparent; -webkit-text-stroke: 1.5px var(--ink); }
.hero-intro {
  max-width: 46ch;
  margin-top: clamp(20px, 3vh, 40px);
  color: var(--ink-dim);
  font-size: clamp(15px, 1.2vw, 18px);
}
.hero-ctas { display: flex; flex-wrap: wrap; gap: 16px; margin-top: clamp(24px, 4vh, 48px); }
.btn {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: 0.08em;
  padding: 14px 28px;
  border: 1px solid var(--line);
  transition: background 0.35s var(--ease), color 0.35s var(--ease), border-color 0.35s var(--ease), transform 0.35s var(--ease), box-shadow 0.35s var(--ease);
}
.btn-solid { background: var(--acc); border-color: var(--acc); color: #fff; }
.btn-solid:hover { transform: translateY(-2px); }
.btn-ghost:hover { border-color: var(--acc); color: var(--acc); transform: translateY(-2px); }

/* Creative Archive Cloud —— refero 风格演化 */
.cloud {
  position: relative;
  height: clamp(360px, 62vh, 620px);
  border-left: 1px solid var(--line-soft);
  overflow: hidden;
}
.cloud::before, .cloud::after {
  content: '';
  position: absolute;
  background: var(--line-soft);
}
.cloud::before { left: 0; right: 0; top: 50%; height: 1px; }
.cloud::after { top: 0; bottom: 0; left: 50%; width: 1px; }
.cloud-label {
  position: absolute;
  top: 12px; right: 0;
  color: var(--ink-faint);
}
.cloud-frag {
  position: absolute;
  animation: float 9s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-14px) rotate(1.5deg); }
}
@keyframes floatSlow {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-10px) rotate(-2deg); }
}
@keyframes pulseGlow {
  0%, 100% { opacity: 0.25; }
  50% { opacity: 0.6; }
}
.frag-img {
  overflow: hidden;
  border: 1px solid var(--line);
  background: var(--bg-soft);
  transition: border-color 0.4s var(--ease), box-shadow 0.4s var(--ease), transform 0.4s var(--ease);
}
.frag-img:hover {
  border-color: var(--acc);
  transform: scale(1.03);
}
.frag-img img { width: 100%; height: 100%; object-fit: cover; opacity: 0.9; }
.frag-chip {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  color: var(--ink-dim);
  border: 1px solid var(--line);
  padding: 5px 10px;
  background: var(--bg);
  white-space: nowrap;
  transition: color 0.3s var(--ease), border-color 0.3s var(--ease), box-shadow 0.3s var(--ease);
}
.frag-chip:hover { color: var(--acc); border-color: var(--acc); box-shadow: 0 0 12px var(--acc-dim); }
.frag-chip.purple { color: var(--acc); border-color: rgba(157, 122, 247, 0.45); }
.frag-num {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-faint);
  letter-spacing: 0.14em;
}
.frag-cross { width: 18px; height: 18px; position: absolute; }
.frag-cross::before, .frag-cross::after { content: ''; position: absolute; background: var(--ink-faint); }
.frag-cross::before { left: 50%; top: 0; bottom: 0; width: 1px; }
.frag-cross::after { top: 50%; left: 0; right: 0; height: 1px; }

/* refero 风格几何碎片 */
.frag-geo {
  position: absolute;
  border: 1px solid var(--line);
  opacity: 0.3;
  animation: floatSlow 12s ease-in-out infinite;
}
.frag-geo.triangle {
  width: 0; height: 0;
  border-left: 14px solid transparent;
  border-right: 14px solid transparent;
  border-bottom: 24px solid var(--acc);
  opacity: 0.15;
  animation: floatSlow 14s ease-in-out infinite;
}
.frag-geo.circle {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1px solid var(--acc);
  opacity: 0.2;
  animation: floatSlow 10s ease-in-out infinite;
}
.frag-geo.rect {
  width: 40px; height: 20px;
  border: 1px solid var(--line);
  opacity: 0.18;
  animation: floatSlow 16s ease-in-out infinite;
}
.frag-geo.dot {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--acc);
  opacity: 0.35;
  animation: pulseGlow 4s ease-in-out infinite;
}
.frag-line {
  position: absolute;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--line), transparent);
  opacity: 0.4;
}

/* ---------------- 通用板块 ---------------- */
.section { padding: clamp(100px, 16vh, 200px) 0; border-top: 1px solid var(--line-soft); }
.sec-head { display: flex; align-items: baseline; gap: clamp(16px, 2vw, 32px); margin-bottom: clamp(40px, 6vh, 80px); }
.sec-num { font-family: var(--font-mono); font-size: 13px; color: var(--acc); letter-spacing: 0.14em; }
.sec-title {
  font-family: var(--font-disp);
  font-weight: 900;
  font-size: clamp(40px, 6.5vw, 104px);
  line-height: 0.95;
  letter-spacing: -0.02em;
  text-transform: uppercase;
}
.sec-zh { font-size: clamp(14px, 1.2vw, 18px); color: var(--ink-dim); margin-left: auto; }

/* ---------------- Selected Works（编辑式节奏布局） ---------------- */
.work { display: grid; gap: clamp(20px, 3vw, 48px); margin-bottom: clamp(120px, 18vh, 220px); align-items: end; }
.work:last-child { margin-bottom: 0; }
.work-media { overflow: hidden; background: var(--bg-soft); border: 1px solid var(--line-soft); position: relative; }
.work-media img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform 0.8s var(--ease);
}
.work:hover .work-media img { transform: scale(1.03); }
.work-media::after {
  content: attr(data-cat);
  position: absolute;
  left: 16px; top: 16px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  color: var(--ink);
  background: rgba(14, 14, 18, 0.7);
  border: 1px solid var(--line);
  padding: 5px 10px;
}
.work-info { display: flex; flex-direction: column; gap: 14px; }
.work-num {
  font-family: var(--font-mono);
  font-size: clamp(40px, 4vw, 64px);
  color: transparent;
  -webkit-text-stroke: 1px var(--ink-faint);
  line-height: 1;
}
.work-title {
  font-family: var(--font-disp);
  font-weight: 800;
  font-size: clamp(28px, 3.4vw, 56px);
  line-height: 1.02;
  letter-spacing: -0.01em;
}
.work-sub { color: var(--ink-dim); font-size: 15px; }
.work-meta {
  display: flex; flex-wrap: wrap; gap: 8px 24px;
  font-family: var(--font-mono); font-size: 11px;
  color: var(--ink-faint); letter-spacing: 0.06em;
}
.work-value { color: var(--ink-dim); font-size: 15px; max-width: 52ch; }
.work-keys { display: flex; flex-wrap: wrap; gap: 8px; }
.key {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em;
  border: 1px solid var(--line); padding: 5px 10px; color: var(--ink-dim);
  text-transform: uppercase;
  transition: border-color 0.3s var(--ease), color 0.3s var(--ease), background 0.3s var(--ease);
}
.key:hover { border-color: var(--acc); color: var(--ink); background: var(--acc); }
.work-link {
  font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.08em;
  color: var(--ink); width: fit-content;
  border-bottom: 1px solid var(--acc);
  padding-bottom: 4px;
  transition: color 0.3s var(--ease), letter-spacing 0.3s var(--ease), border-color 0.3s var(--ease);
}
.work-link:hover { color: var(--acc); letter-spacing: 0.14em; border-color: var(--acc); }

/* 统一交替构图 */
.work { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); align-items: center; }
.work:nth-child(even) { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); }
.work:nth-child(even) .work-media { order: -1; }
.work .work-media { aspect-ratio: 16 / 10; }

/* ---------------- Workflow ---------------- */
.flow { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0; border-left: 1px solid var(--line-soft); }
.flow-step {
  padding: 24px 20px 32px;
  border-right: 1px solid var(--line-soft);
  border-top: 1px solid transparent;
  position: relative;
  transition: background 0.4s var(--ease), transform 0.4s var(--ease);
}
.flow-step:hover { background: var(--bg-hover); transform: translateY(-4px); }
.flow-step::before {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 100%; height: 1px;
  background: var(--acc);
  transform: scaleX(0); transform-origin: left;
  transition: transform 0.5s var(--ease);
}
.flow-step:hover::before { transform: scaleX(1); }
.flow-num { font-family: var(--font-mono); font-size: 11px; color: var(--acc); letter-spacing: 0.12em; display: block; margin-bottom: 14px; }
.flow-t { font-weight: 700; font-size: 15px; margin-bottom: 8px; }
.flow-d { color: var(--ink-faint); font-size: 12.5px; line-height: 1.55; }

/* ---------------- 数字文件袋 ---------------- */
.envs { display: grid; grid-template-columns: repeat(5, 1fr); gap: clamp(12px, 1.5vw, 24px); }
.env {
  --eacc: var(--acc);
  position: relative;
  border: 1px solid var(--line);
  border-top: none;
  padding: 44px 18px 18px;
  min-height: 300px;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  transition: border-color 0.4s var(--ease), transform 0.4s var(--ease), box-shadow 0.4s var(--ease);
}
.env:hover, .env.open {
  border-color: var(--eacc);
  transform: translateY(-4px);
}
.env-flap {
  position: absolute;
  top: -14px; left: -1px; right: -1px;
  height: 30px;
  border: 1px solid var(--line);
  background: var(--bg);
  transform: rotate(-2.4deg);
  transform-origin: left bottom;
  transition: transform 0.55s var(--ease), border-color 0.4s var(--ease);
}
.env:hover .env-flap, .env.open .env-flap {
  transform: rotate(-7deg) translateY(-5px);
  border-color: var(--eacc);
}
.env-num {
  font-family: var(--font-mono);
  font-size: 12px; letter-spacing: 0.14em;
  color: var(--ink-faint);
  transition: color 0.35s var(--ease);
}
.env:hover .env-num, .env.open .env-num { color: var(--eacc); }
.env-name {
  font-family: var(--font-disp);
  font-weight: 800;
  font-size: clamp(17px, 1.35vw, 22px);
  line-height: 1.15;
  text-transform: uppercase;
  margin-top: 10px;
  transition: color 0.35s var(--ease);
}
.env:hover .env-name, .env.open .env-name { color: var(--eacc); }
.env-count { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); letter-spacing: 0.12em; margin-top: 6px; text-transform: uppercase; }
.env-view { margin-top: auto; height: 130px; overflow: hidden; padding-top: 18px; }
.env-thumbs {
  display: flex; gap: 8px;
  transform: translateY(115%);
  transition: transform 0.55s var(--ease);
}
.env:hover .env-thumbs, .env.open .env-thumbs { transform: translateY(0); }
.env-thumb {
  flex: 1;
  aspect-ratio: 4 / 3;
  overflow: hidden;
  border: 1px solid var(--line-soft);
  background: var(--bg-soft);
  transition: border-color 0.3s var(--ease), transform 0.3s var(--ease);
}
.env-thumb:hover { border-color: var(--eacc); transform: scale(1.05); }
.env-thumb img { width: 100%; height: 100%; object-fit: cover; }
.env-hint { font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); letter-spacing: 0.1em; margin-top: 12px; text-transform: uppercase; }

/* ---------------- About Preview / About ---------------- */
.about-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(24px, 4vw, 80px); align-items: start; }
.about-photo {
  aspect-ratio: 4 / 5;
  overflow: hidden;
  border: 1px solid var(--line);
  background: var(--bg-soft);
  position: relative;
}
.about-photo img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform 0.6s var(--ease), filter 0.6s var(--ease);
  filter: grayscale(0.15) contrast(1.05);
}
.about-photo:hover img { transform: scale(1.03); filter: grayscale(0) contrast(1.08); }
.about-photo.todo {
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-faint);
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em;
}
.about-lead {
  font-family: var(--font-disp);
  font-weight: 700;
  font-size: clamp(22px, 2.4vw, 36px);
  line-height: 1.25;
  letter-spacing: -0.01em;
}
.about-block { margin-top: 36px; }
.about-block h3 { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em; color: var(--acc); text-transform: uppercase; margin-bottom: 14px; }
.about-block p { color: var(--ink-dim); max-width: 62ch; }
.caps { display: flex; flex-wrap: wrap; gap: 8px; }
.caps li {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em;
  border: 1px solid var(--line); padding: 7px 12px; color: var(--ink-dim);
  transition: border-color 0.3s var(--ease), color 0.3s var(--ease);
}
.caps li:hover { border-color: var(--acc); color: var(--acc); }

/* ---------------- Experience ---------------- */
.exp {
  display: grid;
  grid-template-columns: minmax(0, 3fr) minmax(0, 5fr);
  gap: clamp(32px, 4vw, 64px);
  padding: clamp(48px, 6vh, 80px) 0;
  border-top: 1px solid var(--line-soft);
  transition: background 0.4s var(--ease);
}
.exp:hover { background: rgba(245,244,241,0.02); }
.exp:last-child { border-bottom: 1px solid var(--line-soft); }
.exp-thumb { aspect-ratio: 4 / 3; overflow: hidden; border: 1px solid var(--line-soft); background: var(--bg-soft); }
.exp-thumb img { width: 100%; height: 100%; object-fit: cover; }
.exp-body { display: flex; flex-direction: column; gap: 18px; }
.exp-company { font-family: var(--font-disp); font-weight: 800; font-size: clamp(32px, 3.5vw, 56px); transition: color 0.3s var(--ease); line-height: 1.05; letter-spacing: -0.02em; }
.exp:hover .exp-company { color: var(--acc); }
.exp-meta { display: flex; flex-wrap: wrap; gap: 8px 32px; font-family: var(--font-mono); font-size: 12px; color: var(--ink-faint); letter-spacing: 0.08em; }
.exp-duties { display: flex; flex-wrap: wrap; gap: 10px; }
.exp-duties .key { font-size: 11px; padding: 7px 14px; }

/* ---------------- Contact ---------------- */
.contact { text-align: left; }
.contact-title {
  font-family: var(--font-disp);
  font-weight: 900;
  font-size: clamp(56px, 11vw, 180px);
  line-height: 0.92;
  letter-spacing: -0.02em;
  text-transform: uppercase;
}
.contact-title .arrow { color: var(--acc); }
.contact-sub { color: var(--ink-dim); margin-top: 24px; font-size: clamp(15px, 1.2vw, 18px); }
.contact-rows { margin-top: 40px; border-top: 1px solid var(--line-soft); }
.contact-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px 0; border-bottom: 1px solid var(--line-soft);
  font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.08em;
  color: var(--ink-dim);
  transition: color 0.3s var(--ease), border-color 0.3s var(--ease);
}
.contact-row:hover { color: var(--ink); border-color: var(--acc); }
.footer {
  padding: 32px 0 40px;
  font-family: var(--font-mono); font-size: 11px;
  color: var(--ink-faint); letter-spacing: 0.08em;
  display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
}

/* ---------- Galaxy 粒子云 ---------- */
#galaxyCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: auto;
}

/* ---------- PhotonCursor 光标（细微发光 + 光电感，克制精致） ---------- */
#photon-cursor {
  --pc: 165 92% 62%;            /* 荧光绿 */
  --pc-soft: 165 92% 74%;
  --pc-cold: 205 92% 74%;       /* 冷白（点击时短暂过渡） */
  position: fixed;
  inset: 0;
  pointer-events: none;         /* 关键：绝不阻挡任何点击 / 输入 */
  z-index: 9999;
  mix-blend-mode: screen;
  opacity: 1;
  transition: opacity 0.25s ease;
}
#photon-cursor.is-hidden { opacity: 0; }

/* 中心 4px 高亮光点 */
.pc-dot {
  position: absolute;
  width: 4px; height: 4px;
  border-radius: 50%;
  background: hsl(var(--pc-soft));
  box-shadow: 0 0 5px 0 hsl(var(--pc) / 0.55);
  opacity: 0;
}
#photon-cursor.pc-active .pc-dot {
  box-shadow: 0 0 8px 0 hsl(var(--pc) / 0.8);
}

/* 外层 20px 半透明细线圆环 */
.pc-ring {
  position: absolute;
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 1px solid hsl(var(--pc) / 0.38);
  box-shadow: 0 0 6px 0 hsl(var(--pc) / 0.18);
  opacity: 0;
}

/* 悬停：圆环平滑放大至 30px + 短暂「电流扫描」（单次，不持续闪烁） */
#photon-cursor.pc-active .pc-ring {
  border-color: hsl(var(--pc) / 0.55);
  box-shadow: 0 0 9px 0 hsl(var(--pc) / 0.26);
}
#photon-cursor.pc-active .pc-ring::after {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: 50%;
  border: 1px solid transparent;
  border-top-color: hsl(var(--pc-soft) / 0.9);
  animation: pc-scan 0.5s linear 1;
}
@keyframes pc-scan {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

/* 移动残影：短光点，200ms 内淡出 */
.pc-trail {
  position: absolute;
  width: 3px; height: 3px;
  margin: -1.5px 0 0 -1.5px;
  border-radius: 50%;
  background: hsl(var(--pc-soft) / 0.8);
  box-shadow: 0 0 4px 0 hsl(var(--pc) / 0.5);
  opacity: 0;
  pointer-events: none;
}
.pc-trail.on {
  animation: pc-trail-fade 0.2s ease-out forwards;
}
@keyframes pc-trail-fade {
  from { opacity: 0.5; transform: scale(1); }
  to   { opacity: 0; transform: scale(0.4); }
}

/* 点击：圆环快速缩小→恢复（一次脉冲，约 220ms） */
#photon-cursor.pc-pulse .pc-ring { animation: pc-ring-pulse 0.22s ease-out 1; }
@keyframes pc-ring-pulse {
  0%   { transform: scale(1); }
  35%  { transform: scale(0.72); }
  100% { transform: scale(1); }
}

/* 点击：向外扩散并淡出的细线圆环（约 300ms） */
.pc-pulse-ring {
  position: absolute;
  width: 20px; height: 20px;
  margin: -10px 0 0 -10px;
  border-radius: 50%;
  border: 1px solid hsl(var(--pc-cold) / 0.7);
  opacity: 0;
  pointer-events: none;
}
.pc-pulse-ring.on { animation: pc-ripple 0.3s ease-out forwards; }
@keyframes pc-ripple {
  from { opacity: 0.6; transform: scale(0.9); }
  to   { opacity: 0; transform: scale(1.9); }
}

/* 减少动态：关闭脉冲 / 扫描 / 残影动画，仅保留静态跟随 */
@media (prefers-reduced-motion: reduce) {
  #photon-cursor.pc-pulse .pc-ring,
  #photon-cursor.pc-active .pc-ring::after,
  .pc-trail.on,
  .pc-pulse-ring.on { animation: none !important; }
}

/* ---------- StrokeText ---------- */
.stroke-text-svg {
  display: block;
  width: 100%;
  overflow: visible;
}
.stroke-text-svg text {
  font-family: var(--font-disp);
  font-weight: 900;
  text-transform: uppercase;
  fill: none;
  stroke: var(--acc);
  stroke-width: 1.2;
  stroke-linejoin: round;
  stroke-linecap: round;
}
.stroke-text-svg .stroke-fill {
  fill: var(--ink);
  stroke: none;
  opacity: 0;
}

/* ---------- FoldText ---------- */
.fold-text {
  display: inline-block;
  line-height: 0.95;
  letter-spacing: -0.02em;
  white-space: pre-wrap;
}
.fold-text-sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.fold-text-visual {
  display: inline;
}
.fold-text-segment {
  display: inline-block;
  perspective: 700px;
  transform-style: preserve-3d;
  vertical-align: baseline;
}
.fold-text-piece {
  position: relative;
  display: inline-block;
  transform-style: preserve-3d;
  backface-visibility: hidden;
  will-change: transform, opacity;
}
.fold-text-piece::after {
  content: '';
  position: absolute;
  inset: -0.08em -0.02em;
  pointer-events: none;
  opacity: var(--fold-crease, 0);
  mix-blend-mode: multiply;
  border-radius: 0.08em;
  background: linear-gradient(180deg, rgba(0,0,0,0.58) 0%, rgba(0,0,0,0.22) 42%, rgba(255,255,255,0.26) 100%);
}

/* 响应式追加：触摸设备 / 窄屏关闭光标 */
@media (max-width: 860px), (hover: none) {
  #photon-cursor { display: none; }
}

/* 动效降级追加 */
@media (prefers-reduced-motion: reduce) {
  .fold-text-piece { transform: none !important; }
  .fold-text-piece::after { opacity: 0 !important; }
  .stroke-text-svg text { stroke-dashoffset: 0 !important; }
  .stroke-text-svg .stroke-fill { opacity: 1 !important; }
}

(function () {

  function setLang(l) {

  }
  var lang = getLang();
  function T() { return D.I18N[lang]; }
  function cat(id) {
    for (var i = 0; i < D.CATEGORIES.length; i++) if (D.CATEGORIES[i].id === id) return D.CATEGORIES[i];
    return null;
  }
  function proj(slug) {
    for (var i = 0; i < D.PROJECTS.length; i++) if (D.PROJECTS[i].slug === slug) return D.PROJECTS[i];
    return null;

  function isTodo(v) { return typeof v === 'string' && v.indexOf('TODO') === 0; }
  function txt(v) { return v[lang] || v.zh; }
  function maybeTodo(v) { return isTodo(v.zh) ? '<span class="todo">' + esc(txt(v)) + '</span>' : esc(txt(v)); }
  function esc(s) {

  // 超长图按 2000px 精确切片，约 17 段之和 = 原始高度 32768px
  var PART_HEIGHTS = [2000, 2000, 2000, 2000, 2000, 2000, 2000, 2000, 2000, 2000, 2000, 2000, 2000, 2000, 2000, 2000, 768];
  var LONG_IMG_H = 32768;

  // 把「超长图缩略图」映射到对应的切片 + 局部 object-position，
  // 复现与原图一致的取景（原图高 32768px，超出 Firefox/Safari 上限会渲染失败）
  function thumbView(thumb) {
    if (!thumb || !thumb.parts || !thumb.parts.length) return { src: thumb.file, pos: thumb.pos };
    var pos = String(thumb.pos || '50% 50%').trim().split(/\s+/);
    var pct = parseFloat(pos[pos.length - 1]) || 0;
    var y = pct / 100 * LONG_IMG_H;
    var acc = 0, idx = 0;
    for (var i = 0; i < PART_HEIGHTS.length; i++) {
      if (y < acc + PART_HEIGHTS[i]) { idx = i; break; }
      acc += PART_HEIGHTS[i];
    }
    var localPct = ((y - acc) / PART_HEIGHTS[idx]) * 100;
    return { src: thumb.parts[idx], pos: '50% ' + localPct.toFixed(1) + '%' };
  }

  function imgTag(thumb, alt, extra) {

  /* ---------- FoldText（3D 折叠入场） ---------- */
  function foldText(el, opts) {
    if (reduced || !window.gsap) return;
    opts = opts || {};
    var text = el.textContent;
    el.textContent = '';
    el.classList.add('fold-text');
    var visual = document.createElement('span');
    visual.className = 'fold-text-visual';
    visual.setAttribute('aria-hidden', 'true');
    var sr = document.createElement('span');
    sr.className = 'fold-text-sr-only';
    sr.textContent = text;
    el.appendChild(sr);
    el.appendChild(visual);
    var pieces = [];
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      var seg = document.createElement('span');
      seg.className = 'fold-text-segment';
      var piece = document.createElement('span');
      piece.className = 'fold-text-piece';
      piece.textContent = ch === ' ' ? ' ' : ch;
      seg.appendChild(piece);
      visual.appendChild(seg);
      pieces.push(piece);
    }
    gsap.set(pieces, { opacity: 0, rotateX: -92, transformOrigin: '50% 0%' });
    var tl = gsap.timeline({
      paused: true,
      scrollTrigger: { trigger: el, start: 'top 85%', once: true }
    });
    tl.to(pieces, {
      opacity: 1, rotateX: 0,
      duration: opts.duration || 0.65,
      ease: opts.ease || 'power3.out',
      stagger: opts.stagger || 0.045,
      clearProps: 'willChange'

  }

  /* ---------- StrokeText（SVG 描边绘制） ---------- */
  function strokeText(el, opts) {
    if (reduced || !window.gsap) return;
    opts = opts || {};
    var text = opts.text || el.textContent;
    var fontSize = opts.fontSize || 140;
    var noFill = opts.noFill;
    var strokeColor = opts.strokeColor || (noFill ? 'var(--ink)' : 'var(--acc)');
    var fillColor = opts.fillColor || 'var(--ink)';
    var drawDuration = opts.drawDuration || 1.6;
    var stagger = opts.stagger || 0.05;
    var fillDelay = opts.fillDelay || 0.3;
    el.innerHTML = '';
    el.style.lineHeight = '0';
    var svgNS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('class', 'stroke-text-svg');
    var vbW = Math.max(400, Math.round(text.length * fontSize * 0.68 + 120));
    var vbH = Math.round(fontSize * 1.15);
    svg.setAttribute('viewBox', '0 -' + fontSize + ' ' + vbW + ' ' + vbH);
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    svg.style.width = '100%';
    svg.style.height = 'auto';
    var txtStroke = document.createElementNS(svgNS, 'text');
    txtStroke.setAttribute('x', '10');
    txtStroke.setAttribute('y', '0');
    txtStroke.setAttribute('fill', 'none');
    txtStroke.setAttribute('stroke', strokeColor);
    txtStroke.setAttribute('stroke-width', opts.strokeWidth || '2');
    txtStroke.setAttribute('stroke-linejoin', 'round');
    txtStroke.setAttribute('stroke-linecap', 'round');
    txtStroke.style.fontSize = fontSize + 'px';
    txtStroke.style.fontWeight = opts.fontWeight || '900';
    txtStroke.style.letterSpacing = (opts.letterSpacing || -4) + 'px';
    var charsS = [];
    for (var i = 0; i < text.length; i++) {
      var ch = text[i] === ' ' ? ' ' : text[i];
      var ts = document.createElementNS(svgNS, 'tspan');
      ts.textContent = ch;
      txtStroke.appendChild(ts);
      charsS.push(ts);
    }
    svg.appendChild(txtStroke);
    if (!noFill) {
      var txtFill = document.createElementNS(svgNS, 'text');
      txtFill.setAttribute('x', '10');
      txtFill.setAttribute('y', '0');
      txtFill.setAttribute('fill', fillColor);
      txtFill.setAttribute('class', 'stroke-fill');
      txtFill.style.fontSize = fontSize + 'px';
      txtFill.style.fontWeight = opts.fontWeight || '900';
      txtFill.style.letterSpacing = (opts.letterSpacing || -4) + 'px';
      txtFill.style.opacity = '0';
      for (var j = 0; j < text.length; j++) {
        var ch2 = text[j] === ' ' ? ' ' : text[j];
        var tf = document.createElementNS(svgNS, 'tspan');
        tf.textContent = ch2;
        txtFill.appendChild(tf);
      }
      svg.appendChild(txtFill);
    }
    el.appendChild(svg);
    var dash = fontSize * 7;
    gsap.set(charsS, { strokeDasharray: dash, strokeDashoffset: dash });
    var tl = gsap.timeline({
      scrollTrigger: opts.scrollTrigger || { trigger: el, start: 'top 85%', once: true }
    });
    tl.to(charsS, { strokeDashoffset: 0, duration: drawDuration, ease: opts.ease || 'power2.out', stagger: stagger });
    if (!noFill && svg.querySelector('.stroke-fill')) {
      tl.to(svg.querySelector('.stroke-fill'), { opacity: 1, duration: 0.8, ease: 'power2.out' }, '+=' + fillDelay);
    }
  }

  /* ---------- Galaxy 粒子云（Canvas 2D） ---------- */
  function initGalaxy(container) {
    if (!container) return;
    var canvas = document.createElement('canvas');
    canvas.id = 'galaxyCanvas';
    container.appendChild(canvas);
    var ctx = canvas.getContext('2d');
    var W, H, cx, cy;
    var particles = [];
    var mouse = { x: -9999, y: -9999 };
    var COUNT = 180;
    function resize() {
      var rect = container.getBoundingClientRect();
      W = canvas.width = rect.width;
      H = canvas.height = rect.height;
      cx = W / 2; cy = H / 2;
    }
    resize();
    window.addEventListener('resize', resize);
    container.addEventListener('mousemove', function (e) {
      var rect = container.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
    });
    container.addEventListener('mouseleave', function () {
      mouse.x = -9999; mouse.y = -9999;
    });
    for (var i = 0; i < COUNT; i++) {
      var angle = Math.random() * Math.PI * 2;
      var dist = Math.random() * Math.min(W, H) * 0.45;
      particles.push({
        angle: angle,
        dist: dist,
        size: Math.random() * 2 + 0.5,
        speed: (Math.random() - 0.5) * 0.002,
        opacity: Math.random() * 0.6 + 0.2,
        hue: 260 + Math.random() * 40
      });
    }
    var time = 0;
    function draw() {
      if (!document.body.contains(canvas)) return;
      requestAnimationFrame(draw);
      ctx.clearRect(0, 0, W, H);
      time += 0.0005;
      for (var i = 0; i < COUNT; i++) {
        var p = particles[i];
        p.angle += p.speed;
        var x = cx + Math.cos(p.angle + time) * p.dist;
        var y = cy + Math.sin(p.angle + time) * p.dist * 0.6;
        var dx = x - mouse.x;
        var dy = y - mouse.y;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d < 80) {
          var f = (80 - d) / 80;
          x += (dx / d) * f * 30;
          y += (dy / d) * f * 30;
        }
        var twinkle = Math.sin(time * 3 + i) * 0.3 + 0.7;
        ctx.beginPath();
        ctx.arc(x, y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = 'hsla(' + p.hue + ', 70%, 75%, ' + (p.opacity * twinkle) + ')';
        ctx.fill();
      }
    }
    draw();
  }

  /* ---------- PhotonCursor 光标（细微发光 + 光电感，克制精致） ----------
     结构：中心 4px 光点 + 20px 半透明细线圆环。
     纯原生 rAF 跟随，不依赖 GSAP，不使用持续新增 DOM 的粒子。
     仅桌面鼠标设备启用；触摸设备 / 减少动态 / 编辑区均自动降级。 */
  function initSplashCursor() {
    // 触摸设备（无 hover）直接关闭，避免误触发
    if (window.matchMedia('(hover: none)').matches) return;
    if (document.getElementById('photon-cursor')) return;

    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var root = document.createElement('div');
    root.id = 'photon-cursor';
    var ring = document.createElement('div');
    ring.className = 'pc-ring';
    var dot = document.createElement('div');
    dot.className = 'pc-dot';
    root.appendChild(ring);
    root.appendChild(dot);
    document.body.appendChild(root);

    // 残影 + 点击扩散环：固定小池，复用节点，不无限新增 DOM
    var pool = [];
    function poolEl(cls) {
      for (var i = 0; i < pool.length; i++) {
        if (pool[i].className === cls && pool[i].free) { pool[i].free = false; return pool[i]; }
      }
      var el = document.createElement('div');
      el.className = cls;
      root.appendChild(el);
      pool.push(el);
      return el;
    }

    function hideCursor() { root.classList.add('is-hidden'); }
    function showCursor() { root.classList.remove('is-hidden'); }
    hideCursor();

    // 不隐藏系统光标的情况：编辑区（输入框 / 可编辑文本）需保留原生文字光标
    var EDITABLE = 'input, textarea, select, [contenteditable="true"], [contenteditable=""], [contenteditable="plaintext-only"]';
    function isEditable(el) { return !!(el && el.closest && el.closest(EDITABLE)); }

    var hidden = false;                 // 当前是否隐藏了系统光标
    function syncNativeCursor(el) {
      var ed = isEditable(el);
      if (ed && !hidden) { document.body.style.cursor = ''; hidden = true; }
      else if (!ed && hidden) { document.body.style.cursor = 'none'; hidden = false; }
    }

    // --- 状态 ---
    var mx = -1e4, my = -1e4;   // 目标（真实鼠标）
    var fx = mx, fy = my;       // 光点（紧跟）
    var rx = mx, ry = my;       // 圆环（轻微延迟）
    var active = false;         // 悬停交互目标（按钮 / 链接 / 导航 / 卡片）
    var activeT = 0;            // 悬停强度 0..1
    var lastTrail = 0, lastMove = 0;
    var havePoint = false;

    // 光标圆环采用「屏幕坐标 + transform」定位，便于 rAF 内快速更新
    ring.style.left = '0px'; ring.style.top = '0px';
    dot.style.left = '0px'; dot.style.top = '0px';

    function spawnTrail(x, y) {
      var el = poolEl('pc-trail');
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.style.opacity = '0.5';
      el.classList.remove('on');
      requestAnimationFrame(function () { el.classList.add('on'); });
    }

    // 点击：一次光电脉冲（圆环缩小→恢复）+ 向外扩散的细线环
    function pulse() {
      root.classList.remove('pc-pulse');
      void root.offsetWidth; // 强制重排以重启动画
      root.classList.add('pc-pulse');
      var p = poolEl('pc-pulse-ring');
      p.style.left = mx + 'px';
      p.style.top = my + 'px';
      p.classList.remove('on');
      void p.offsetWidth;
      p.classList.add('on');
      setTimeout(function () { p.free = true; }, 320);
    }

    function frame(t) {
      // 悬停强度：交互目标渐入 / 渐出（无高频闪烁）
      activeT += ((active ? 1 : 0) - activeT) * 0.2;
      if (Math.abs(activeT) < 0.002) activeT = 0;

      // 光点紧跟，圆环带轻微滞后（不影响操作）
      var k1 = reduced ? 1 : 0.72;
      var k2 = reduced ? 1 : 0.18;
      fx += (mx - fx) * k1;
      fy += (my - fy) * k1;
      rx += (mx - rx) * k2;
      ry += (my - ry) * k2;

      // 圆环：基础 20px，悬停平滑放大到 30px
      var target = 20 + activeT * 12;
      var scale = target / 20;
      var tx = 'translate3d(' + rx.toFixed(2) + 'px,' + ry.toFixed(2) + 'px,0) translate(-50%,-50%) scale(' + scale.toFixed(4) + ')';
      ring.style.transform = tx;
      ring.style.opacity = (havePoint ? (0.5 + activeT * 0.35) : 0).toFixed(3);
      root.classList.toggle('pc-active', activeT > 0.5);

      dot.style.transform = 'translate3d(' + fx.toFixed(2) + 'px,' + fy.toFixed(2) + 'px,0) translate(-50%,-50%)';
      dot.style.opacity = havePoint ? '1' : '0';

      // 2~3 个短残影，仅在移动时按间距生成，200ms 内淡出
      if (!reduced && havePoint) {
        var now = t;
        if (now - lastMove < 220) {
          var d = Math.hypot(mx - fx, my - fy);
          if (d > 6 && now - lastTrail > 42) {
            lastTrail = now;
            spawnTrail((mx + fx) / 2, (my + fy) / 2);
          }
        }
      }

      // 鼠标离开窗口：自然淡出；重新进入：恢复
      if (!havePoint || nowHidden) {
        if (!root.classList.contains('is-hidden')) hideCursor();
      }

      requestAnimationFrame(frame);
    }

    var nowHidden = false;
    function onMouseMove(e) {
      mx = e.clientX; my = e.clientY;
      if (!havePoint) { fx = mx; fy = my; rx = mx; ry = my; havePoint = true; }
      lastMove = performance.now();
      if (root.classList.contains('is-hidden')) showCursor();
      syncNativeCursor(e.target);
    }
    function onMouseLeave() {
      havePoint = false;
      nowHidden = true;
      setTimeout(function () { nowHidden = false; }, 120);
    }
    function onMouseEnter(e) {
      nowHidden = false;
      havePoint = true;
      mx = e.clientX; my = e.clientY;
      showCursor();
      syncNativeCursor(e.target);
    }
    function onMouseOver(e) {
      var t = e.target.closest('.cursor-target, a, button, .env, .work-media, .btn');
      active = !!t && !isEditable(t);
    }
    function onMouseDown(e) {
      if (isEditable(e.target)) return;
      if (e.button === 0) pulse();
    }

    window.addEventListener('mousemove', onMouseMove, { passive: true });
    window.addEventListener('mouseover', onMouseOver, true);
    document.addEventListener('mouseleave', onMouseLeave);
    document.addEventListener('mouseenter', onMouseEnter);
    window.addEventListener('mousedown', onMouseDown, true);

    // 编辑区：交还系统光标并临时关闭光球
    function onFocusIn(e) { if (isEditable(e.target)) hideCursor(); }
    function onFocusOut(e) {
      if (isEditable(e.target) && document.activeElement !== e.target) showCursor();
    }
    document.addEventListener('focusin', onFocusIn, true);
    document.addEventListener('focusout', onFocusOut, true);

    if (reduced) {
      // 减少动态：不隐藏系统光标、无残影、无脉冲，仅保留轻量光点+圆环跟随
      document.body.style.cursor = '';
    } else {
      document.body.style.cursor = 'none';
      hidden = true;
    }

    requestAnimationFrame(frame);
  }

  /* ---------- 滚动显现 ---------- */
  function observeReveals() {
    var els = document.querySelectorAll('.reveal');
    if (reduced || !('IntersectionObserver' in window)) {
      els.forEach(function (el) { el.classList.add('in'); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) {
          var el = en.target;
          var d = parseInt(el.getAttribute('data-delay') || '0', 10);
          setTimeout(function () { el.classList.add('in'); }, Math.min(d, 300));
          io.unobserve(el);
        }
      });
    }, { threshold: 0.12 });
    els.forEach(function (el) { io.observe(el); });
  }

  /* ================= 首页 ================= */
  function renderHome() {

    /* Hero */
    var hero = document.getElementById('hero');
    var frags = [
      { cls: 'frag-img', file: 'assets/portfolio-long-images/ai-planet/optimized/ai-planet-part-01.png', pos: '50% 3%', style: 'width:180px;height:120px;left:8%;top:14%;animation-duration:9s', alt: 'AI Planet KV' },
      { cls: 'frag-img', file: 'assets/portfolio-long-images/pajama-party/optimized/IP2-part-01.png', pos: '50% 5%', style: 'width:150px;height:110px;right:6%;top:38%;animation-duration:11s;animation-delay:-3s', alt: 'Pajama Party KV' },
      { cls: 'frag-img', file: 'assets/portfolio-long-images/meow-coffee/optimized/meow-coffee-part-01.png', pos: '50% 10%', style: 'width:130px;height:96px;left:22%;bottom:12%;animation-duration:10s;animation-delay:-5s', alt: 'MEOW COFFEE' },
      { cls: 'frag-chip purple', text: 'PROMPT × ITERATION', style: 'left:44%;top:8%;animation-duration:8s;animation-delay:-2s' },
      { cls: 'frag-chip', text: 'STORYBOARD', style: 'right:14%;top:16%;animation-duration:12s;animation-delay:-4s' },
      { cls: 'frag-chip', text: 'KEY VISUAL', style: 'left:4%;top:56%;animation-duration:9.5s;animation-delay:-1s' },
      { cls: 'frag-chip', text: 'CURATION → CUT', style: 'right:22%;bottom:22%;animation-duration:10.5s;animation-delay:-6s' },
      { cls: 'frag-num', text: 'ARCH-001 / 2026', style: 'left:50%;top:47%' },
      { cls: 'frag-num', text: 'N 39°54′ · E 116°23′', style: 'right:4%;bottom:8%' },
      { cls: 'frag-cross', style: 'left:30%;top:32%' },
      { cls: 'frag-cross', style: 'right:30%;top:62%' },
      { cls: 'frag-cross', style: 'left:60%;bottom:16%' },
      { cls: 'frag-geo triangle', style: 'left:12%;top:22%;animation-delay:-2s' },
      { cls: 'frag-geo circle', style: 'right:18%;top:18%;animation-delay:-4s' },
      { cls: 'frag-geo rect', style: 'left:55%;bottom:28%;animation-delay:-6s' },
      { cls: 'frag-geo dot', style: 'left:38%;top:62%;animation-delay:-1s' },
      { cls: 'frag-geo dot', style: 'right:28%;top:48%;animation-delay:-3s' },
      { cls: 'frag-geo dot', style: 'left:18%;bottom:38%;animation-delay:-5s' },
      { cls: 'frag-line', style: 'width:60px;left:42%;top:35%;transform:rotate(25deg)' },
      { cls: 'frag-line', style: 'width:40px;right:22%;bottom:35%;transform:rotate(-15deg)' }
    ];
    var fragHTML = frags.map(function (f) {
      var inner = '';
      if (f.cls === 'frag-img') inner = '<img src="' + base + encodeURI(f.file) + '" alt="' + esc(f.alt) + '" loading="lazy" style="object-position:' + f.pos + '">';
      else if (f.text) inner = esc(f.text);
      return '<div class="cloud-frag ' + f.cls + '" style="' + f.style + '" aria-hidden="true">' + inner + '</div>';
    }).join('');

    hero.innerHTML =
      '<div class="hero-left">' +
        '<div class="hero-tags reveal"><span>' + t.hero.tagA + '</span><span>' + t.hero.tagB + '</span></div>' +
        '<h1 class="hero-name reveal" data-delay="80"><span class="hero-row1">JIANG</span><span class="row2">YISHAN</span></h1>' +
        '<p class="hero-intro reveal" data-delay="160">' + t.hero.intro + '</p>' +
        '<div class="hero-ctas reveal" data-delay="240">' +
          '<a class="btn btn-solid" href="#works">' + t.hero.ctaWorks + '</a>' +
          '<a class="btn btn-ghost" href="about.html">' + t.hero.ctaAbout + '</a>' +
        '</div>' +
      '</div>' +
      '<div class="cloud" id="heroCloud" aria-hidden="true"><span class="cloud-label mono">' + t.hero.cloud + '</span>' + fragHTML + '</div>';

    /* StrokeText Hero */
    if (!reduced && window.gsap) {
      var row1 = hero.querySelector('.hero-row1');
      var row2 = hero.querySelector('.row2');
      if (row1) strokeText(row1, { fontSize: 200, strokeWidth: 2.5, drawDuration: 1.4, stagger: 0.06, fillDelay: 0.4, strokeColor: 'var(--acc)' });
      if (row2) strokeText(row2, { fontSize: 200, strokeWidth: 2.5, drawDuration: 1.4, stagger: 0.06, noFill: true, strokeColor: 'var(--ink)' });
    }
    /* Galaxy */
    initGalaxy(document.getElementById('heroCloud'));

    function secHead(id, s) {
      return '<div class="sec-head reveal">' +
        '<h2 class="sec-title" data-fold="true">' + s.title + '</h2></div>';
    }

    /* About Preview */
    var ab = document.getElementById('about');
    var hasPhoto = !isTodo({ zh: t.about.photo });
    var photoHTML = hasPhoto
      ? '<div class="about-photo reveal"><img src="' + base + encodeURI(t.about.photo) + '" alt="Jiang Yishan"></div>'
      : '<div class="about-photo todo reveal"><span class="todo">' + t.about.photo + '</span></div>';
    ab.innerHTML = secHead('about', t.sections.about) +
      '<div class="about-grid">' +
        photoHTML +
        '<div class="reveal" data-delay="120">' +
          '<p class="about-lead">' + t.about.lead + '</p>' +
          '<p class="about-bio">' + t.about.bio + '</p>' +
          '<div class="about-block"><h3>' + t.about.capsTitle + '</h3><div class="about-caps">' +
            t.about.caps.map(function (c) { return '<span class="key">' + esc(c) + '</span>'; }).join('') +
          '</div></div>' +
          '<div class="about-block"><a class="work-link" href="about.html">' + t.labels.more + '</a></div>' +
        '</div>' +
      '</div>';

    /* Selected Works */
    var works = document.getElementById('works');
    works.innerHTML = secHead('works', t.sections.works) + featured.map(function (p, i) {
      var c = cat(p.category);
      return '<article class="work reveal">' +
        '<div class="work-info">' +
          '<span class="work-num">' + p.num + '</span>' +
          '<h3 class="work-title">' + esc(txt(p.title)) + '</h3>' +
          '<p class="work-sub">' + esc(txt(p.subtitle)) + '</p>' +
          '<div class="work-meta"><span>' + maybeTodo(p.date) + '</span><span>' + maybeTodo(p.role) + '</span></div>' +
          '<p class="work-value">' + esc(txt(p.value)) + '</p>' +
          '<div class="work-keys">' + p.keywords[lang].map(function (k) { return '<span class="key">' + esc(k) + '</span>'; }).join('') + '</div>' +
          '<a class="work-link" href="projects/' + p.slug + '.html">' + t.labels.viewCase + '</a>' +
        '</div>' +
        '<a class="work-media cursor-target" href="projects/' + p.slug + '.html" data-cat="' + esc(txt(c.name)) + '" style="border-top:2px solid ' + c.accent + '">' +
          imgTag(p.thumb, txt(p.title)) +
        '</a>' +
      '</article>';
    }).join('');

    /* Workflow */
    var flow = document.getElementById('workflow');
    flow.innerHTML = secHead('workflow', t.sections.workflow) +
      '<div class="flow">' + t.workflow.map(function (s, i) {
        return '<div class="flow-step reveal" data-delay="' + i * 60 + '">' +
          '<span class="flow-num">0' + (i + 1) + '</span>' +
          '<div class="flow-t">' + esc(s.t) + '</div>' +
          '<div class="flow-d">' + esc(s.d) + '</div></div>';
      }).join('') + '</div>';

    /* Archive */
    var arch = document.getElementById('archive');
    arch.innerHTML = secHead('archive', t.sections.archive) + '<div class="envs" id="envHome"></div>';
    renderEnvelopes(document.getElementById('envHome'));

    /* Experience */
    var ex = document.getElementById('experience');
    ex.innerHTML = secHead('experience', t.sections.experience) + D.INTERNSHIPS.map(function (i) {
      var thumbTag = i.linkedProject
        ? '<a class="exp-thumb cursor-target" href="projects/' + i.linkedProject + '.html" aria-label="' + esc(txt(i.company)) + '">' + imgTag(i.thumb, txt(i.company)) + '</a>'
        : '<div class="exp-thumb">' + imgTag(i.thumb, txt(i.company)) + '</div>';
      return '<div class="exp reveal">' +
        thumbTag +
        '<div class="exp-body">' +
          '<h3 class="exp-company">' + esc(txt(i.company)) + '</h3>' +
          '<div class="exp-meta"><span>' + maybeTodo(i.period) + '</span><span>' + maybeTodo(i.role) + '</span><span>' + maybeTodo(i.department) + '</span></div>' +
          '<div class="exp-duties">' + i.duties[lang].map(function (d) { return '<span class="key">' + esc(d) + '</span>'; }).join('') + '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    /* Contact */
    var ct = document.getElementById('contact');
    ct.innerHTML = secHead('contact', t.sections.contact) +
      '<div class="contact reveal">' +
        '<h2 class="contact-title" data-fold="true">' + t.contact.title + ' <span class="arrow">↗</span></h2>' +
        '<p class="contact-sub">' + t.contact.sub + '</p>' +
        '<div class="contact-rows">' +
          '<div class="contact-row"><span>EMAIL</span><span>' + esc(t.contact.email) + '</span></div>' +
          '<div class="contact-row"><span>PHONE</span><span>' + esc(t.contact.phone) + '</span></div>' +
        '</div>' +
      '</div>';

    /* FoldText 板块标题 */
    if (!reduced && window.gsap) {
      document.querySelectorAll('[data-fold="true"]').forEach(function (el) {
        foldText(el, { duration: 0.65, stagger: 0.045 });
      });
    }
  }

  /* ================= 档案页 ================= */
  function renderArchive() {
    var t = T();
    var el = document.getElementById('archivePage');
    el.innerHTML =
      '<div class="sec-head reveal"><span class="sec-num">A–Z</span><h2 class="sec-title" data-fold="true">WORK ARCHIVE</h2><span class="sec-zh">' + t.sections.archive.zh + '</span></div>' +
      '<div class="envs" id="envArchive"></div>';
    renderEnvelopes(document.getElementById('envArchive'));
    if (!reduced && window.gsap) {
      el.querySelectorAll('[data-fold="true"]').forEach(function (el) { foldText(el, { duration: 0.65, stagger: 0.045 }); });
    }
  }

  /* ================= About 页 ================= */
  function renderAbout() {
    var t = T();
    var el = document.getElementById('aboutPage');
    var hasPhoto = !isTodo({ zh: t.about.photo });
    var photoHTML = hasPhoto
      ? '<div class="about-photo reveal"><img src="' + base + encodeURI(t.about.photo) + '" alt="Jiang Yishan"></div>'
      : '<div class="about-photo todo reveal"><span class="todo">' + t.about.photo + '</span></div>';
    el.innerHTML =
      '<div class="sec-head reveal"><span class="sec-num">04</span><h2 class="sec-title" data-fold="true">ABOUT</h2><span class="sec-zh">' + t.sections.about.zh + '</span></div>' +
      '<div class="about-grid">' +
        photoHTML +
        '<div class="reveal" data-delay="120">' +
          '<p class="about-lead">' + t.about.lead + '</p>' +
          '<p class="about-bio">' + t.about.bio + '</p>' +
          '<div class="about-block"><h3>' + t.about.capsTitle + '</h3><div class="about-caps">' +
            t.about.caps.map(function (c) { return '<span class="key">' + esc(c) + '</span>'; }).join('') +
          '</div></div>' +
          '<div class="about-block"><h3>' + t.about.toolsTitle + '</h3><p>' + t.about.tools + '</p></div>' +
          '<div class="about-block"><h3>' + t.about.eduTitle + '</h3><p class="todo">' + t.about.edu + '</p></div>' +
        '</div>' +
      '</div>';
    if (!reduced && window.gsap) {
      el.querySelectorAll('[data-fold="true"]').forEach(function (el) { foldText(el, { duration: 0.65, stagger: 0.045 }); });
    }
  }

  /* ================= 项目详情页 ================= */
  function renderProject() {
    var t = T();
    var slug = body.getAttribute('data-slug');
    var p = proj(slug);
    var el = document.getElementById('project');
    if (!p) { el.innerHTML = '<p class="todo">TODO · Project not found</p>'; return; }
    var c = cat(p.category);

    var meta =
      '<dl class="pj-meta reveal">' +
        '<div><dt>' + t.labels.date + '</dt><dd>' + maybeTodo(p.date) + '</dd></div>' +
        '<div><dt>' + t.labels.role + '</dt><dd>' + maybeTodo(p.role) + '</dd></div>' +
        (p.tools ? '<div><dt>' + t.labels.tools + '</dt><dd>' + maybeTodo(p.tools) + '</dd></div>' : '') +
        '<div><dt>' + t.labels.keywords + '</dt><dd>' + p.keywords[lang].join(' · ') + '</dd></div>' +
      '</dl>';

    var outline = '<section class="pj-section"><h2 class="pj-h2 reveal">' + t.labels.outline + ' — ' + (p.tier === 'A' ? 'FULL CASE' : 'COMPACT CASE') + '</h2>' +
      '<ol class="pj-outline">' + p.sections.map(function (s, i) {
        return '<li class="reveal" data-delay="' + Math.min(i * 40, 240) + '"><span class="idx">' + String(i + 1).padStart(2, '0') + '</span><span>' + esc(txt(s)) + '</span></li>';
      }).join('') + '</ol></section>';

    var boards = '<section class="pj-section"><h2 class="pj-h2 reveal">' + t.labels.fullBoard + '</h2>' +
      p.boards.map(function (b, idx) {
        var lazy = idx > 0 ? ' loading="lazy"' : '';
        return '<figure class="pj-board reveal"><img src="' + base + encodeURI(b) + '" alt="' + esc(txt(p.title)) + '" decoding="async"' + lazy + '></figure>';
      }).join('') + '</section>';

    var extraSection = '';
    if (slug === 'huiboyuntong' && p.videos && p.videos.length) {
      extraSection = '<section class="pj-section"><div class="pj-video-grid">' +
        p.videos.map(function(v) {
          return '<div class="pj-video-item reveal">' +
            '<video src="' + base + encodeURI(v.src) + '" poster="' + base + encodeURI(v.poster) + '" muted autoplay loop playsinline preload="metadata"></video>' +
            '<span class="pj-video-label">' + esc(txt(v.title)) + '</span>' +
          '</div>';
        }).join('') +
      '</div></section>';
    }

    var idx = D.PROJECTS.indexOf(p);
    var next = D.PROJECTS[(idx + 1) % D.PROJECTS.length];
    var nav =
      '<div class="pj-nav reveal">' +
        '<a class="work-link" href="' + base + 'index.html">' + t.labels.backHome + '</a>' +
        '<a class="pj-next" href="' + next.slug + '.html"><small>' + t.labels.nextProject + '</small>' + esc(txt(next.title)) + ' ↗</a>' +
      '</div>';

    var titleHTML = esc(txt(p.title));
    var foldAttr = ' data-fold="true"';
    if (slug === 'meow-coffee') {
      titleHTML = '<span class="pj-title-line">猫咖啡 MEOW</span><span class="pj-title-line">COFFEE</span>';
      foldAttr = '';
    }

    el.innerHTML =
      '<header class="pj-hero">' +
        '<span class="pj-num reveal" style="color:' + c.accent + '">' + p.num + ' — ' + esc(txt(c.name)) + '</span>' +
        '<h1 class="pj-title reveal" data-delay="80"' + foldAttr + '>' + titleHTML + '</h1>' +
        '<p class="pj-sub reveal" data-delay="140">' + esc(txt(p.subtitle)) + '</p>' +
        '<p class="pj-value reveal" data-delay="200">' + esc(txt(p.value)) + '</p>' +
        meta +
      '</header>' +
      outline + boards + extraSection + nav;

    document.title = txt(p.title) + ' — Jiang Yishan';

    if (!reduced && window.gsap) {
      var titleEl = el.querySelector('[data-fold="true"]');
      if (titleEl) foldText(titleEl, { duration: 0.65, stagger: 0.04 });
    }
  }

  /* ---------- 启动 ---------- */
  renderChrome();
  if (page === 'home') renderHome();
  else if (page === 'archive') renderArchive();
  else if (page === 'about') renderAbout();
  else if (page === 'project') renderProject();
  observeReveals();
  initSplashCursor();
})();

</script>
</body>
</html>
